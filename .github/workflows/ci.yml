name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  licenses:
    name: License check (ASF Category A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      # Core install only: this is what users and the Docker image get.
      - name: Check core dependencies
        run: |
          uv sync --locked --no-dev
          uv run --no-sync --with pip-licenses pip-licenses --from=mixed --format=json \
            | uv run --no-sync python scripts/check_licenses.py
      # Everything, including build, lint, and test tools (AGENTS.md). Reviewed
      # build-only MPL tools are accepted here only (decision 20).
      - name: Check all dependency groups
        run: |
          uv sync --locked --all-groups
          uv run --no-sync pip-licenses --from=mixed --format=json \
            | uv run --no-sync python scripts/check_licenses.py --allow-build-only

  frontend:
    name: Front end lint, type check, test, build, licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      # Checks package-lock.json, so it covers build, lint, and test tools too.
      - name: License check (ASF Category A)
        run: node scripts/check-licenses.mjs
      - name: Install
        run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
