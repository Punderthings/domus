[project]
name = "domus"
version = "0.0.1"
description = "Holistic home helper: IoT and equipment inventory, mapping, maintenance, and Home Assistant integration."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
authors = [{ name = "The Domus maintainers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "icalendar>=6.0",
    "pillow>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0.36",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=15",
]

[project.optional-dependencies]
# Experimental PostgreSQL support (decision 2). pg8000 is pure Python and
# BSD-3-Clause; 1.31.5 fixes CVE-2025-61385.
postgres = ["pg8000>=1.31.5"]

[project.scripts]
domus = "domus.cli:main"

[project.urls]
Homepage = "https://github.com/punderthings/domus"
Issues = "https://github.com/punderthings/domus/issues"

[dependency-groups]
dev = [
    "pip-licenses>=5.0",
    "pre-commit>=4.3",
    "pyright>=1.1.408",
    "pytest>=8.4",
    "ruff>=0.14",
]
docs = [
    "zensical>=0.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["docs", "src/frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.pyright]
include = ["src/domus", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
